[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricecomp"
version = "0.1.0"
description = "Comparador de precios de celulares: proveedor (PDF) vs mercado (Personal, Movistar, MercadoLibre)"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "playwright>=1.45",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
pricecomp = "pricecomp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"pricecomp.web" = ["static/*"]
